apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rabbit
  name: rabbit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbit
  strategy: {}
  template:
    metadata:
      labels:
        app: rabbit
    spec:
      containers:
        - image: rabbitmq:4.3.4-management
          name: rabbit
          imagePullPolicy: Always  # this is additionon
          ports:
            - containerPort: 15672
            - containerPort: 5672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: resu
            - name: RABBITMQ_DEFAULT_PASS
              value: resu
          resources: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbit
spec:
  selector:
    app: rabbit
  ports:
    - name: management
      port: 15672
      targetPort: 15672
    - name: amqp
      port: 5672
      targetPort: 5672
