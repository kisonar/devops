apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-config
data:
  haproxy.cfg: |
    global
      log stdout format raw local0

    defaults
      mode http
      log global
      timeout connect 5s
      timeout client  60s
      timeout server  60s

    frontend rabbit_web
      bind *:15672
      default_backend rabbit_web_backend

    backend rabbit_web_backend
      server rabbit rabbit:15672 check
    
    listen stats
      bind *:3001
      stats enable
      stats uri /monitor
      stats refresh 5s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: haproxy
  name: haproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      containers:
        - image: haproxy:3.4.7
          name: haproxy
          ports:
            - containerPort: 15672
            - containerPort: 3001
          volumeMounts:
            - name: haproxy-config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
      volumes:
        - name: haproxy-config
          configMap:
            name: haproxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: haproxy
spec:
  type: NodePort
  selector:
    app: haproxy
  ports:
    - name: rabbit-web
      port: 15672
      targetPort: 15672
      nodePort: 31672
    - name: monitor
      port: 3001
      targetPort: 3001
      nodePort: 30001