services:
  mysql:
    image: mysql:26.7.0
    container_name: mysql
    restart: always
    ports:
      - "33060:33060"
      - "3306:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d/
      - ./storage:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=rocco
      - MYSQL_PASSWORD=rocco
  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=mysql
      - PMA_ARBITRARY=1