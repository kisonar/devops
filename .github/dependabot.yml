version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directories:
      - "/ansible/stuff/databases/no-sql/dynamodb"
      - "/ansible/stuff/databases/no-sql/elk"
      - "/ansible/stuff/databases/no-sql/influxdb"
      - "/ansible/stuff/databases/no-sql/mongo"
      - "/ansible/stuff/databases/no-sql/redis"
      - "/ansible/stuff/databases/sql/mariadb"
      - "/ansible/stuff/databases/sql/mysql"
      - "/ansible/stuff/databases/sql/oracle"
      - "/ansible/stuff/services/ci-cd"
      - "/ansible/stuff/services/httpd"
      - "/ansible/stuff/services/ldap/openldap"
      - "/ansible/stuff/services/load-balancers/GoBetween/docker"
      - "/ansible/stuff/services/load-balancers/Haproxy/docker"
      - "/ansible/stuff/services/load-balancers/nginx/docker"
      - "/ansible/stuff/services/messaging/kafka"
      - "/ansible/stuff/services/messaging/mqtt"
      - "/ansible/stuff/services/messaging/pulsar"
      - "/ansible/stuff/services/messaging/rabbit-mq"
      - "/ansible/stuff/services/monitoring"
      - "/ansible/stuff/services/node-red"
      - "/ansible/stuff/services/remote-access"
      - "/ansible/stuff/services/sonarqube"
      - "/ansible/stuff/services/wiremock"

    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
